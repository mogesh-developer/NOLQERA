[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "nolqera"
version = "0.1.0"
description = "A from-scratch NLP toolkit for learning and experimentation."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Mogesh" }
]
dependencies = []


[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]


[project.scripts]
nolqera-cli = "nolqera.cli:main"


[tool.setuptools.packages.find]
include = ["nolqera*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]